<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>摄影作品集 - Wade Pan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#8B5CF6', light: '#A78BFA', dark: '#7C3AED' },
            accent: '#C084FC',
            dark: { DEFAULT: '#0a0a0f', light: '#13131a', lighter: '#1e1e2a', border: '#2a2a3a' },
            gray: { DEFAULT: '#8b8ba0', light: '#b8b8cc' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #0a0a0f; color: #d4d4e0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #1e1e2a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #8B5CF6; }
    .glow-card { background: #13131a; border: 1px solid #2a2a3a; border-radius: 1rem; transition: all 0.3s ease; }
    .glow-card:hover { border-color: rgba(139,92,246,0.3); transform: translateY(-2px); }
    .gradient-text { background: linear-gradient(135deg, #8B5CF6, #C084FC, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>
  <!-- Nav -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-dark/80 backdrop-blur-md border-b border-dark-border/50">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/portfolio/" class="text-xl font-bold text-white tracking-tight">
        <span class="gradient-text">Wade</span>
      </a>
      <a href="/portfolio/" class="text-gray hover:text-white transition-colors text-sm flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        返回主页
      </a>
    </div>
  </nav>

  <main class="pt-24 pb-20 px-6">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">摄影作品集</h1>
        <p class="text-gray text-lg">活动跟拍 · 户外徒步 · 人物纪实</p>
      </div>

      <!-- Filter Tabs -->
      <div class="flex flex-wrap justify-center gap-3 mb-12" id="filters"></div>

      <!-- Photo Grid -->
      <div class="columns-2 md:columns-3 lg:columns-3 gap-4 space-y-4 mb-24" id="photoGrid"></div>

      <!-- Video Section -->
      <div class="mt-8">
        <div class="text-center mb-12">
          <h2 class="text-2xl md:text-3xl font-bold text-white mb-3">视频作品</h2>
          <p class="text-gray">活动全程记录 · 后期剪辑包装</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="videoGrid"></div>
        <p class="text-center text-gray text-sm mt-8">完整版视频请访问 B 站搜索「安亦a他」</p>
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 z-[100] bg-dark/95 backdrop-blur-sm items-center justify-center p-6 hidden">
    <button class="absolute top-6 right-6 text-gray hover:text-white transition-colors z-10" onclick="closeLightbox()">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
    <img id="lightboxImg" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl" />
    <p id="lightboxCaption" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-gray-light text-sm"></p>
  </div>

  <!-- Video Modal -->
  <div id="videoModal" class="fixed inset-0 z-[100] bg-dark/95 backdrop-blur-sm items-center justify-center p-6 hidden">
    <button class="absolute top-6 right-6 text-gray hover:text-white transition-colors z-10" onclick="closeVideoModal()">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
    <div class="w-full max-w-4xl">
      <div id="modalIframeWrap" class="aspect-video bg-dark-lighter rounded-lg overflow-hidden">
        <iframe id="modalIframe" class="w-full h-full" allowfullscreen="true" frameborder="0" scrolling="no"></iframe>
      </div>
      <p id="modalTitle" class="text-white text-center mt-4 text-lg font-medium"></p>
    </div>
  </div>

  <script>
    const photos = [
      { src: 'portfolio/IMG_0025.JPG', category: '活动跟拍', caption: '团队活动纪实' },
      { src: 'portfolio/IMG_0051-rp4624811568.jpg', category: '活动跟拍', caption: '黄鹤楼留影' },
      { src: 'portfolio/IMG_0056.JPG', category: '户外徒步', caption: '户外探险活动' },
      { src: 'portfolio/IMG_0058.JPG', category: '户外徒步', caption: '自然采风记录' },
      { src: 'portfolio/IMG_0061-rp4624772287.jpg', category: '人物纪实', caption: '活动人物特写' },
      { src: 'portfolio/IMG_0068.JPG', category: '活动跟拍', caption: '团建活动现场' },
      { src: 'portfolio/IMG_0071.JPG', category: '活动跟拍', caption: '夜间团建活动' },
      { src: 'portfolio/IMG_0074-rp4624792059.jpg', category: '人物纪实', caption: '户外人物记录' },
      { src: 'portfolio/IMG_0083-rp4624811732.jpg', category: '人物纪实', caption: '徒步人物抓拍' },
      { src: 'portfolio/IMG_0136.JPG', category: '户外徒步', caption: '竹林探险' },
      { src: 'portfolio/IMG_0146.JPG', category: '户外徒步', caption: '茶山采风' },
      { src: 'portfolio/IMG_0147.JPG', category: '户外徒步', caption: '户外活动记录' },
      { src: 'portfolio/IMG_0283-rp4624792625.jpg', category: '人物纪实', caption: '活动瞬间捕捉' },
      { src: 'portfolio/IMG_0858.JPG', category: '户外徒步', caption: '山林徒步' },
      { src: 'portfolio/IMG_0955.JPG', category: '户外徒步', caption: '户外探险纪实' },
    ]

    const videos = [
      { title: '新疆乌孙古道 110km 徒步', poster: 'video-covers/wusun.jpg', bvid: 'BV1tbGQ6tEwk' },
      { title: '千织贡嘎', poster: 'video-covers/gongga.jpg', bvid: 'BV18sGQ6cEUU' },
      { title: '稻城亚丁洛克线', poster: 'video-covers/daocheng.jpg', bvid: 'BV1U4GQ6fE6k' },
      { title: '千织哈巴', poster: 'video-covers/haba.jpg', bvid: 'BV18sGQ6cEV9' },
      { title: '致学碧岩古道', poster: 'video-covers/biyan.jpg', bvid: 'BV1qgGQ66EEY' },
      { title: '致学天字古道', poster: 'video-covers/tianzi.jpg', bvid: 'BV1quGQ63Ei2' },
      { title: '国能团建全程', poster: 'video-covers/guoneng.jpg', bvid: 'BV1quGQ63EBA' },
      { title: '上海柏毅', poster: 'video-covers/baiyi.jpg', bvid: 'BV1ogGQ66Eyq' },
    ]

    const filters = ['全部', '活动跟拍', '户外徒步', '人物纪实']
    let activeFilter = '全部'

    function renderFilters() {
      document.getElementById('filters').innerHTML = filters.map(f => `
        <button onclick="setFilter('${f}')"
          class="px-5 py-2 rounded-full text-sm font-medium transition-all border
          ${f === activeFilter
            ? 'bg-primary text-white border-primary shadow-lg shadow-primary/25'
            : 'bg-dark-light border-dark-border text-gray hover:text-white hover:border-primary/40'}">
          ${f}
        </button>
      `).join('')
    }

    function renderPhotos() {
      const filtered = activeFilter === '全部' ? photos : photos.filter(p => p.category === activeFilter)
      document.getElementById('photoGrid').innerHTML = filtered.map(p => `
        <div class="break-inside-avoid group cursor-pointer relative overflow-hidden rounded-xl border border-dark-border hover:border-primary/30 transition-all duration-300"
             onclick="openLightbox('${p.src}', '${p.caption}')">
          <img src="${p.src}" alt="${p.caption}" loading="lazy"
               class="w-full block group-hover:scale-105 transition-transform duration-500" />
          <div class="absolute inset-0 bg-gradient-to-t from-dark/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
            <span class="text-white text-sm font-medium">${p.caption}</span>
          </div>
        </div>
      `).join('')
    }

    function renderVideos() {
      document.getElementById('videoGrid').innerHTML = videos.map((v, i) => `
        <div class="glow-card overflow-hidden group" onclick="playVideo(${i})">
          <div class="aspect-video relative bg-dark-lighter overflow-hidden cursor-pointer">
            <img src="${v.poster}" alt="${v.title}" loading="lazy"
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            <div class="absolute inset-0 bg-dark/40 flex items-center justify-center">
              <div class="w-14 h-14 rounded-full bg-primary/80 backdrop-blur-sm flex items-center justify-center group-hover:bg-primary transition-colors shadow-lg">
                <svg class="w-6 h-6 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </div>
            </div>
          </div>
          <div class="p-4">
            <h3 class="text-white font-medium text-sm">${v.title}</h3>
            <p class="text-gray text-xs mt-1">摄影 / 后期剪辑</p>
          </div>
        </div>
      `).join('')
    }

    function playVideo(index) {
      const v = videos[index]
      const modal = document.getElementById('videoModal')
      const iframe = document.getElementById('modalIframe')
      const title = document.getElementById('modalTitle')
      title.textContent = v.title
      iframe.src = `//player.bilibili.com/player.html?bvid=${v.bvid}&autoplay=1&high_quality=1`
      modal.classList.remove('hidden')
      modal.classList.add('flex')
      document.body.style.overflow = 'hidden'
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal')
      const iframe = document.getElementById('modalIframe')
      iframe.src = ''
      modal.classList.add('hidden')
      modal.classList.remove('flex')
      document.body.style.overflow = ''
    }

    function setFilter(f) {
      activeFilter = f
      renderFilters()
      renderPhotos()
    }

    function openLightbox(src, alt) {
      document.getElementById('lightboxImg').src = src
      document.getElementById('lightboxCaption').textContent = alt
      document.getElementById('lightbox').classList.remove('hidden')
      document.getElementById('lightbox').classList.add('flex')
      document.body.style.overflow = 'hidden'
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden')
      document.getElementById('lightbox').classList.remove('flex')
      document.body.style.overflow = ''
    }

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox()
    })

    document.getElementById('videoModal').addEventListener('click', function(e) {
      if (e.target === this) closeVideoModal()
    })

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeLightbox()
        closeVideoModal()
      }
    })

    renderFilters()
    renderPhotos()
    renderVideos()
  </script>
</body>
</html>
